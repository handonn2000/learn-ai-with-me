<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Sketch che chữ trên điện thoại</title>
<!-- Thiết kế mẫu B · màn "7c · Sketch che chữ" · khung 390×844 · dữ liệu trong màn là dữ liệu mẫu -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Onest:wght@400;500;600;700&amp;family=Playpen+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A33C9}a:hover{color:#14162B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0F7; color: #14162B; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px">
    <button type="button" aria-label="Thoát buổi học" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #3F4560; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div role="progressbar" aria-label="Tiến độ buổi học" aria-valuenow="8" aria-valuemin="0" aria-valuemax="8" style="flex: 1; height: 14px; border-radius: 7px; background: #DADDEA; overflow: hidden"><div style="width: 100%; height: 14px; border-radius: 7px; background: #4A33C9"></div></div>
  </header>

  <main style="flex: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em">Nhớ ra trước, rồi mới chạm để mở ô trống</h1>

    <div style="border-radius: 18px; border: 2px solid #14162B; background-color: #FCFCFE; background-image: linear-gradient(#E9ECF4 1px, transparent 1px); background-size: 100% 26px; overflow: hidden">
      <div role="img" aria-label="Sketch UCS có 5 ô trống, đã mở 2 ô" style="position: relative; width: 354px; height: 530px; margin: 0 auto; font-family: 'Playpen Sans', 'Comic Sans MS', cursive; color: #14162B">
        <svg width="8" height="27" viewBox="0 0 8 27" preserveAspectRatio="none" style="position: absolute; left: 173px; top: 106px; width: 8px; height: 27px; overflow: visible; fill: none; stroke: #14162B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><defs><marker id="dc-arrow-head-filled-1" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#14162B" stroke="none" style="stroke: none; fill: #14162B; fill: context-stroke"></path></marker></defs><path d="M 4 0 L 4 23" marker-end="url(#dc-arrow-head-filled-1)"></path></svg>
        <svg width="8" height="27" viewBox="0 0 8 27" preserveAspectRatio="none" style="position: absolute; left: 173px; top: 210px; width: 8px; height: 27px; overflow: visible; fill: none; stroke: #14162B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><defs><marker id="dc-arrow-head-filled-2" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#14162B" stroke="none" style="stroke: none; fill: #14162B; fill: context-stroke"></path></marker></defs><path d="M 4 0 L 4 23" marker-end="url(#dc-arrow-head-filled-2)"></path></svg>
        <svg width="8" height="27" viewBox="0 0 8 27" preserveAspectRatio="none" style="position: absolute; left: 173px; top: 436px; width: 8px; height: 27px; overflow: visible; fill: none; stroke: #4A33C9; stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; stroke-linejoin: round"><defs><marker id="dc-arrow-head-filled-3" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#4A33C9" stroke="none" style="stroke: none; fill: #4A33C9; fill: context-stroke; stroke-dasharray: none"></path></marker></defs><path d="M 4 0 L 4 23" marker-end="url(#dc-arrow-head-filled-3)"></path></svg>

        <div style="position: absolute; left: 27px; top: 12px; font-size: 19px; font-weight: 700">UCS trên một trang</div>
        <div style="position: absolute; left: 27px; top: 46px; width: 300px; height: 60px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; line-height: 1.3; background: #FFFFFF; border: 2px solid #14162B; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px"><span>Dựa trên frontier, explored và hàng đợi ưu tiên</span></div>
        <div style="position: absolute; left: 27px; top: 134px; width: 300px; height: 76px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3; background: #ECE8FF; border: 3px solid #14162B; border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px"><span><b style="font-size: 24px">UCS</b><br><span style="font-size: 15px">lấy ra nút có <span style="background: #FFE58A; padding: 0 4px">g nhỏ nhất</span></span></span></div>
        <div style="position: absolute; left: 27px; top: 238px; width: 300px; height: 60px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; line-height: 1.3; background: #FFFFFF; border: 2px solid #14162B; border-radius: 15px 255px 15px 225px / 225px 15px 255px 15px"><span>Dừng khi <button type="button" aria-label="Ô trống: khi nào UCS dừng. Chạm để mở" style="min-width: 96px; height: 30px; margin: 0 2px; border: 2px dashed #4A33C9; border-radius: 8px; background: #ECE8FF; color: #4A33C9; font: 700 14px 'Onest', sans-serif; vertical-align: middle">?</button> khỏi frontier</span></div>
        <div style="position: absolute; left: 27px; top: 306px; width: 300px; height: 60px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; line-height: 1.3; background: #FFFFFF; border: 2px solid #14162B; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px"><span>Gặp đường rẻ hơn → <button type="button" aria-label="Ô trống: làm gì khi gặp đường rẻ hơn. Chạm để mở" style="min-width: 110px; height: 30px; margin: 0 2px; border: 2px dashed #4A33C9; border-radius: 8px; background: #ECE8FF; color: #4A33C9; font: 700 14px 'Onest', sans-serif; vertical-align: middle">?</button></span></div>
        <div style="position: absolute; left: 27px; top: 374px; width: 300px; height: 60px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; line-height: 1.3; background: #FFFFFF; border: 2px solid #14162B; border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px"><span>Loang đều mọi hướng → <span style="background: #FFE58A; padding: 0 4px">tốn công</span></span></div>
        <div style="position: absolute; left: 27px; top: 464px; width: 300px; height: 54px; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; line-height: 1.3; background: #FFFFFF; border: 2px dashed #4A33C9; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; color: #2C1E8A"><span>Ga sau: A* = UCS + <button type="button" aria-label="Ô trống: A* thêm gì vào UCS. Chạm để mở" style="min-width: 64px; height: 30px; margin: 0 2px; border: 2px dashed #4A33C9; border-radius: 8px; background: #ECE8FF; color: #4A33C9; font: 700 14px 'Onest', sans-serif; vertical-align: middle">?</button></span></div>
      </div>
    </div>
  </main>

  <footer style="padding: 12px 16px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="font-weight: 600; color: #3F4560">Đã mở 2 trên 5 ô</span>
    <button type="button" style="height: 52px; padding: 0 26px; border-radius: 16px; border: 2px solid #14162B; background: #4A33C9; color: #FFFFFF; box-shadow: 0 4px 0 #14162B; font: 700 17px 'Onest', system-ui, sans-serif">Xong</button>
  </footer>
</div>
</body>
</html>
