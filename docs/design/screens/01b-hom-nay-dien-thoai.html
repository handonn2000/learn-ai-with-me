<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0F7; color: #14162B; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">

      </ol>
      <button type="button" style="margin-top: 18px; width: 100%; height: 56px; border-radius: 16px; border: 2px solid #14162B; background: #4A33C9; color: #FFFFFF; box-shadow: 0 5px 0 #14162B; font: 700 18px 'Onest', system-ui, sans-serif">Bắt đầu buổi học</button>
    </section>

    <section aria-labelledby="g" style="background: #FFFFFF; border-radius: 18px; padding: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 id="g" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Hiểu A*</h2>
        <span style="font-size: 14px; font-weight: 700">5/9 ga</span>
      </div>
      <ol aria-hidden="true" style="list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>

  <nav aria-label="Chính" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #14162B; background: #FFFFFF; padding: 6px 4px 18px; font-size: 12px; font-weight: 600; text-align: center">

    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: #3F4560"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>Ôn tập</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: #3F4560"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>Sổ tay</a>
