<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Màn học — Đoán trước</title>
<!-- Thiết kế mẫu B · màn "3 · Đoán trước" · khung 1280×1100 · dữ liệu trong màn là dữ liệu mẫu -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F7}
a{color:#4A33C9}a:hover{color:#14162B}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #EEF0F7; color: #14162B; font-family: 'Onest', system-ui, sans-serif; font-size: 17px; line-height: 1.5">
  <header style="max-width: 920px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 22px 28px 8px; display: flex; align-items: center; gap: 18px">
    <button type="button" aria-label="Thoát buổi học" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #3F4560; display: grid; place-items: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div role="progressbar" aria-label="Tiến độ buổi học" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8" style="flex: 1; height: 16px; border-radius: 8px; background: #DADDEA; overflow: hidden"><div style="width: 37%; height: 16px; border-radius: 8px; background: #4A33C9"></div></div>
    <span style="font-weight: 700; white-space: nowrap">3 / 8</span>
  </header>

  <main style="flex: 1; max-width: 920px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 18px 28px 40px">
    <section aria-labelledby="q" style="background: #FFFFFF; border: 2px solid #14162B; border-radius: 24px; box-shadow: 0 6px 0 #14162B; padding: 28px 32px 32px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #FFC94A; border: 2px solid #14162B; font-weight: 700; font-size: 15px">Đoán trước</span>
        <span style="font-size: 15px; color: #3F4560">Chưa học phần này. Cứ đoán, sai cũng được.</span>
      </div>
      <h1 id="q" style="margin: 18px 0 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; max-width: 26ch">G vừa vào frontier với g = 13. UCS dừng lại chưa?</h1>

      <figure style="margin: 18px 0 0; padding: 14px; border-radius: 16px; background: #F6F7FB">
        <svg viewBox="0 0 622 322" width="100%" role="img" aria-label="UCS vừa mở rộng C. Frontier: H g=6, D g=7, E g=9, G g=13" style="display: block; max-width: 560px; height: auto; margin: 0 auto; overflow: visible"><line x1="186" y1="186" x2="286" y2="86" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="186" y1="186" x2="286" y2="286" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="186" y1="186" x2="86" y2="136" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="86" y1="136" x2="36" y2="36" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="286" y1="86" x2="386" y2="136" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="286" y1="86" x2="486" y2="86" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="286" y1="286" x2="386" y2="136" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="286" y1="286" x2="436" y2="261" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="386" y1="136" x2="486" y2="86" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="386" y1="136" x2="586" y2="186" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="436" y1="261" x2="586" y2="186" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="486" y1="86" x2="586" y2="186" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><rect x="226" y="127" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="236" y="140.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="226" y="227" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="236" y="240.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="126" y="152" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="136" y="165.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="51" y="77" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="61" y="90.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="326" y="102" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="336" y="115.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="376" y="77" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="386" y="90.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">7</text><rect x="326" y="202" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="336" y="215.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">4</text><rect x="351" y="264.5" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="361" y="278" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">4</text><rect x="426" y="102" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="436" y="115.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><rect x="476" y="152" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="486" y="165.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">7</text><rect x="501" y="214.5" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="511" y="228" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">7</text><rect x="526" y="127" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#CDD2DE"></rect><text x="536" y="140.5" text-anchor="middle" font-size="12" fill="#555B72" font-family="JetBrains Mono, ui-monospace, monospace">3</text><circle cx="186" cy="186" r="18" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="186" y="191.76" text-anchor="middle" font-size="16" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">S</text><text x="186" y="220" text-anchor="middle" font-size="12" fill="#555B72" font-family="Onest, system-ui, sans-serif">Nhà</text><circle cx="286" cy="86" r="18" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="286" y="91.76" text-anchor="middle" font-size="16" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">A</text><circle cx="286" cy="286" r="18" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="286" y="291.76" text-anchor="middle" font-size="16" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">B</text><circle cx="386" cy="136" r="18" fill="#14162B" stroke="#14162B" stroke-width="3"></circle><text x="386" y="141.76" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Onest, system-ui, sans-serif">C</text><circle cx="436" cy="261" r="18" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="436" y="266.76" text-anchor="middle" font-size="16" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">D</text><text x="415" y="245" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=7</text><circle cx="486" cy="86" r="18" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="486" y="91.76" text-anchor="middle" font-size="16" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">E</text><text x="465" y="70" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=9</text><circle cx="86" cy="136" r="18" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="86" y="141.76" text-anchor="middle" font-size="16" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">F</text><circle cx="586" cy="186" r="18" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="586" y="191.76" text-anchor="middle" font-size="16" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">G</text><text x="565" y="170" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=13</text><text x="586" y="220" text-anchor="middle" font-size="12" fill="#555B72" font-family="Onest, system-ui, sans-serif">Trường</text><circle cx="36" cy="36" r="18" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="36" y="41.76" text-anchor="middle" font-size="16" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">H</text><text x="15" y="20" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=6</text></svg>
      </figure>

      <div role="radiogroup" aria-label="Câu trả lời" style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 14px">
        <button type="button" role="radio" aria-checked="true" style="min-height: 84px; text-align: left; padding: 16px 20px; border-radius: 18px; border: 2px solid #4A33C9; background: #ECE8FF; box-shadow: 0 4px 0 #4A33C9; font: inherit; color: #14162B; cursor: pointer; display: flex; flex-direction: column; gap: 2px">
          <b style="font-weight: 700; font-size: 19px">Dừng</b>
          <span style="color: #3F4560; font-size: 15px">G là đích, trả về đường vừa tìm được</span>
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 84px; text-align: left; padding: 16px 20px; border-radius: 18px; border: 2px solid #CDD2DE; background: #FFFFFF; box-shadow: 0 4px 0 #CDD2DE; font: inherit; color: #14162B; cursor: pointer; display: flex; flex-direction: column; gap: 2px">
          <b style="font-weight: 700; font-size: 19px">Chưa dừng</b>
          <span style="color: #3F4560; font-size: 15px">Còn nút rẻ hơn G phải xét trước</span>
        </button>
      </div>

      <fieldset style="border: 0; margin: 22px 0 0; padding: 0">
        <legend style="font-weight: 700; padding: 0">Bạn chắc tới đâu?</legend>
        <div style="margin-top: 10px; display: inline-flex; border: 2px solid #14162B; border-radius: 14px; overflow: hidden; flex-wrap: wrap">
          <label style="display: flex; align-items: center; gap: 8px; padding: 0 18px; min-height: 46px; cursor: pointer; font-weight: 600; border-right: 2px solid #14162B"><input type="radio" name="conf" style="accent-color: #4A33C9; width: 18px; height: 18px">Đoán thôi</label>
          <label style="display: flex; align-items: center; gap: 8px; padding: 0 18px; min-height: 46px; cursor: pointer; font-weight: 600; border-right: 2px solid #14162B"><input type="radio" name="conf" style="accent-color: #4A33C9; width: 18px; height: 18px">Khá chắc</label>
          <label style="display: flex; align-items: center; gap: 8px; padding: 0 18px; min-height: 46px; cursor: pointer; font-weight: 700; background: #14162B; color: #FFFFFF"><input type="radio" name="conf" checked="" style="accent-color: #FFC94A; width: 18px; height: 18px">Rất chắc</label>
        </div>
      </fieldset>
    </section>

    <div style="margin-top: 26px; display: flex; justify-content: flex-end">
      <button type="button" style="height: 58px; padding: 0 34px; border-radius: 16px; border: 2px solid #14162B; background: #4A33C9; color: #FFFFFF; box-shadow: 0 5px 0 #14162B; font: 700 19px 'Onest', system-ui, sans-serif; cursor: pointer">Chốt câu trả lời</button>
    </div>
  </main>
</div>
</body>
</html>
