<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A33C9}a:hover{color:#14162B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF0F7; color: #14162B; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.45">
  <header style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px">
    <button type="button" aria-label="Thoát buổi học" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #3F4560; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div role="progressbar" aria-label="Tiến độ buổi học" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8" style="flex: 1; height: 14px; border-radius: 7px; background: #DADDEA; overflow: hidden"><div style="width: 37%; height: 14px; border-radius: 7px; background: #4A33C9"></div></div>
  </header>

  <main style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 23px; line-height: 1.15; letter-spacing: -0.02em">G vừa vào frontier với g = 13. UCS dừng lại chưa?</h1>
    <figure style="margin: 0; padding: 10px 10px 6px; border-radius: 16px; background: #FFFFFF">
      <svg viewBox="0 0 378 198" width="100%" role="img" aria-label="UCS vừa mở rộng C. Frontier: H g=6, D g=7, E g=9, G g=13" style="display: block; max-width: 330px; height: auto; margin: 0 auto; overflow: visible"><line x1="114" y1="114" x2="174" y2="54" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="114" y1="114" x2="174" y2="174" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="114" y1="114" x2="54" y2="84" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="54" y1="84" x2="24" y2="24" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="174" y1="54" x2="234" y2="84" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="174" y1="54" x2="294" y2="54" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="174" y1="174" x2="234" y2="84" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="174" y1="174" x2="264" y2="159" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="234" y1="84" x2="294" y2="54" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="234" y1="84" x2="354" y2="114" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="264" y1="159" x2="354" y2="114" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><line x1="294" y1="54" x2="354" y2="114" stroke="#CDD2DE" stroke-width="3" stroke-linecap="round"></line><circle cx="114" cy="114" r="12" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="114" y="118.32" text-anchor="middle" font-size="12" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">S</text><circle cx="174" cy="54" r="12" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="174" y="58.32" text-anchor="middle" font-size="12" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">A</text><circle cx="174" cy="174" r="12" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="174" y="178.32" text-anchor="middle" font-size="12" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">B</text><circle cx="234" cy="84" r="12" fill="#14162B" stroke="#14162B" stroke-width="3"></circle><text x="234" y="88.32" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Onest, system-ui, sans-serif">C</text><circle cx="264" cy="159" r="12" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="264" y="163.32" text-anchor="middle" font-size="12" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">D</text><text x="249" y="149" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=7</text><circle cx="294" cy="54" r="12" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="294" y="58.32" text-anchor="middle" font-size="12" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">E</text><text x="279" y="44" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=9</text><circle cx="54" cy="84" r="12" fill="#E3E6EE" stroke="#9AA1B5" stroke-width="2.5"></circle><text x="54" y="88.32" text-anchor="middle" font-size="12" font-weight="700" fill="#555B72" font-family="Onest, system-ui, sans-serif">F</text><circle cx="354" cy="114" r="12" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="354" y="118.32" text-anchor="middle" font-size="12" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">G</text><text x="339" y="104" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=13</text><circle cx="24" cy="24" r="12" fill="#EEEAFF" stroke="#4A33C9" stroke-width="3"></circle><text x="24" y="28.32" text-anchor="middle" font-size="12" font-weight="700" fill="#14162B" font-family="Onest, system-ui, sans-serif">H</text><text x="9" y="14" text-anchor="end" font-size="12.5" fill="#0E7C7B" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">g=6</text></svg>
    </figure>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 2px solid #C2560A; background: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2560A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <span style="display: flex; flex-direction: column"><b style="font-weight: 700">Dừng</b><span style="font-size: 14px; color: #3F4560">Bạn chọn · rất chắc</span></span>
      </div>
      <div style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 2px solid #1D63D6; background: #E3EDFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D63D6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        <span style="display: flex; flex-direction: column"><b style="font-weight: 700">Chưa dừng</b><span style="font-size: 14px; color: #3F4560">Đáp án đúng</span></span>
      </div>
    </div>
  </main>

  <section role="status" aria-labelledby="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFE9DA; border-top: 2px solid #14162B; border-radius: 24px 24px 0 0; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 8px">
    <h2 id="sheet" style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: #8A3A00">Sai lúc đang rất chắc</h2>
    <p style="margin: 0; font-size: 15px">Lỗi kiểu này thường được nhớ lâu nhất sau khi sửa. UCS chỉ dừng khi <b>lấy</b> đích ra khỏi frontier. D (7) và E (9) còn rẻ hơn 13, và qua E sẽ có đường tới G chỉ tốn 12.</p>
    <button type="button" style="margin-top: 8px; height: 54px; border-radius: 16px; border: 2px solid #14162B; background: #14162B; color: #FFFFFF; box-shadow: 0 4px 0 #8A3A00; font: 700 17px 'Onest', system-ui, sans-serif">Xem UCS chạy tiếp</button>
  </section>
</div>
</body>
</html>
